name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: make release VERSION="$GITHUB_REF_NAME"
      - run: cd bin && sha256sum gophkeeper-* > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" bin/gophkeeper-* bin/SHA256SUMS --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
